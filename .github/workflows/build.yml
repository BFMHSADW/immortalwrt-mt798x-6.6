name: Build N60 Pro 512M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Use defconfig
        run: |
          cp defconfig/mt7986-ax6000.config .config
          bash scripts/config --disable CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-mt6000
          bash scripts/config --disable CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jdcloud_re-cp-03
          bash scripts/config --disable CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_tplink_tl-xdr6086
          bash scripts/config --disable CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_tplink_tl-xdr6088
          bash scripts/config --disable CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-ubootmod
          bash scripts/config --disable CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-stock
          bash scripts/config --enable CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro
          make defconfig

      - name: Download
        run: make download -j8

      - name: Build
        run: make -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-firmware
          path: bin/targets/mediatek/*n60-pro*sysupgrade*
